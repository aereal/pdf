name: Go CI

on:
  pull_request:

jobs:
  ok:
    runs-on: ubuntu-slim
    if: failure()
    needs:
      - build-and-test
    permissions: {}
    steps:
      - run: exit 1

  build-and-test:
    name: build Go=${{ matrix.go }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go:
          - stable
          - oldstable
          - '1.24'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ matrix.go }}
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Build
      run: go build -v ./... 
